services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: crime-backend
    ports:
      - "8000:8000"
    environment:
      - DATA_SOURCE_MODE=${DATA_SOURCE_MODE:-hybrid}
      - CACHE_DIR=${CACHE_DIR:-data_cache}
      - API_CACHE_TTL_SECONDS=${API_CACHE_TTL_SECONDS:-300}
      - API_CACHE_MAX_ENTRIES=${API_CACHE_MAX_ENTRIES:-512}
      - API_RESPONSE_CACHE_MAX_AGE=${API_RESPONSE_CACHE_MAX_AGE:-60}
      - CHICAGO_TABLE=${CHICAGO_TABLE:-chicago_crimes}
      - TIDB_USER=${TIDB_USER:-}
      - TIDB_PASSWORD=${TIDB_PASSWORD:-}
      - TIDB_HOST=${TIDB_HOST:-}
      - TIDB_PORT=${TIDB_PORT:-}
      - TIDB_DB_NAME=${TIDB_DB_NAME:-Chicago_data}
      - TID_CA_PATH=${TID_CA_PATH:-}
    volumes:
      - ./:/app

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: crime-frontend
    ports:
      - "3000:3000"
    environment:
      - INTERNAL_API_BASE=${INTERNAL_API_BASE:-http://backend:8000/api}
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-http://localhost:8000/api}
      - API_SERVER_REVALIDATE_SECONDS=${API_SERVER_REVALIDATE_SECONDS:-60}
      - NEXT_PUBLIC_API_CLIENT_CACHE_TTL_MS=${NEXT_PUBLIC_API_CLIENT_CACHE_TTL_MS:-15000}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
